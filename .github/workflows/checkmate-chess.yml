name: Build Checkmate Chess APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "checkmate-chess/**"
      - ".github/workflows/checkmate-chess.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkmate-chess
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: checkmate-chess/android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkmate-chess-debug-apk
          path: checkmate-chess/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error